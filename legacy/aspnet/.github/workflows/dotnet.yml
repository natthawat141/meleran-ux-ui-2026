name: Backend foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Melearn.slnx --locked-mode
      - run: dotnet build Melearn.slnx --configuration Release --no-restore
      - run: dotnet test Melearn.slnx --configuration Release --no-build --no-restore
