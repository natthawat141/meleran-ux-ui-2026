# Run from the monorepo root; build on Cloud Build, not local Docker.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=apps/web/Dockerfile
      - --build-arg=VITE_API_MODE=remote
      - --build-arg=VITE_APP_ENV=production
      - --build-arg=VITE_API_BASE_URL=${_API_BASE_URL}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:${_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=apps/admin/Dockerfile
      - --build-arg=VITE_API_MODE=remote
      - --build-arg=VITE_APP_ENV=production
      - --build-arg=VITE_API_BASE_URL=${_API_BASE_URL}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/admin:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/admin:${_TAG}
substitutions:
  _REGION: asia-southeast3
  _REPOSITORY: melearn-frontend
  _TAG: manual
  _API_BASE_URL: /api/v1
timeout: 1200s
