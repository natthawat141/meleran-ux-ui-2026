name: Fullstack Nest Backend

on:
  push:
    branches: [backend/v1-foundation]
    paths: [backend/**, docs/implementation/**, docs/api-contract/**, .github/workflows/nest.yml]
  pull_request:
    paths: [backend/**, docs/implementation/**, docs/api-contract/**, .github/workflows/nest.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nest-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Ephemeral CI protocol key, never a deployed/provider credential.
      CURSOR_SIGNING_SECRET: ci-pagination-protocol-test-key-only-20261011
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      # Reuse approved frontend Ajv; it never enters the backend runtime.
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Provision ephemeral isolated CI database
        env:
          PGPASSWORD: ci-ephemeral-only
        run: |
          psql -h 127.0.0.1 -p 5433 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE melearn_test_migrator LOGIN PASSWORD 'ci-migrator-only';
          CREATE ROLE melearn_test_app LOGIN PASSWORD 'ci-runtime-only';
          CREATE DATABASE melearn_test OWNER melearn_test_migrator;
          SQL
          PGPASSWORD=ci-migrator-only psql -h 127.0.0.1 -p 5433 -U melearn_test_migrator -d melearn_test -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO melearn_test_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO melearn_test_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE,SELECT ON SEQUENCES TO melearn_test_app;
          SQL
          cat > .env <<'ENV'
          DATABASE_URL=
          TEST_DATABASE_NAME=melearn_test
          TEST_DATABASE_URL=postgresql://melearn_test_app:ci-runtime-only@127.0.0.1:5433/melearn_test?schema=public
          MIGRATION_DATABASE_URL=postgresql://melearn_test_migrator:ci-migrator-only@127.0.0.1:5433/melearn_test?schema=public
          ENV
      - run: pnpm run db:test:validate && pnpm run db:test:generate
      - run: pnpm run db:test:migrate
        env:
          ALLOW_TEST_DATABASE_MIGRATION: 'yes'
      - run: pnpm run typecheck && pnpm run check:blueprint && pnpm run check:boundaries && pnpm run test:foundation
      - run: pnpm run test:components
      - run: pnpm run test:database
        env:
          ALLOW_TEST_DATABASE_RESET: 'yes'
      - run: pnpm run build
      - run: node scripts/smoke-test-api.cjs
      - run: pnpm run test:frontend-detail
        env:
          ALLOW_TEST_DATABASE_RESET: 'yes'
