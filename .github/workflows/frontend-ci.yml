name: Frontend CI

on:
  push:
    branches:
      - main
      - prototype
      - refactor/**
    paths:
      - "apps/**"
      - "packages/**"
      - "public/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "components.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "public/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "components.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:boundaries
      - run: npm run build:web
      - run: npm run build:admin
